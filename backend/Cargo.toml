[package]
name = "Auris"
version = "0.1.0"
edition = "2024"

# Les couches sont exposées en bibliothèque (et pas seulement compilées dans le
# binaire) pour pouvoir être testées depuis `tests/` sans lancer le serveur.


[[bin]]
name = "auris"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres"] }
dotenvy = "0.15.7"
tracing-subscriber = "0.3.23"
