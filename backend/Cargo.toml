[package]
name = "Auris"
version = "0.1.0"
edition = "2024"

# Les couches sont exposées en bibliothèque (et pas seulement compilées dans le
# binaire) pour pouvoir être testées depuis `tests/` sans lancer le serveur.
[lib]
name = "auris"
path = "src/lib.rs"

[[bin]]
name = "auris"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
async-trait = "0.1.92"
thiserror = "2.0.21"
